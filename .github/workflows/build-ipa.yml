name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

  push:
    branches:
      - HasanGs27-patch-1
    paths:
      - "tweak/Sources/Features/NowPlaying/**"
      - "tweak/Sources/Features/AdBlock/**"
      - "scripts/pipeline.sh"
      - "docs/app-icon.jpg"
      - ".github/workflows/build-ipa.yml"

env:
  THEOS: ${{ github.workspace }}/theos
  SPOTIFY_IPA_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.ipa_url || 'https://files.catbox.moe/1qbbn8.ipa' }}

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: levibostian/action-hide-sensitive-inputs@v1
        if: github.event_name == 'workflow_dispatch'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages Pillow git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Test home shelf ordering
        run: |
          clang -fobjc-arc -fblocks -framework Foundation -DSG_HOME_ORDER_TEST=1 \
            tweak/Sources/Features/AdBlock/HomeShelfOrder.m \
            tweak/Sources/Features/AdBlock/Protobuf.m -o "$RUNNER_TEMP/home-order-test"
          "$RUNNER_TEMP/home-order-test"

      - name: Test local download manifest
        run: |
          clang -fobjc-arc -framework Foundation -DSG_LOCAL_DOWNLOAD_MANIFEST_TEST=1 \
            tweak/Sources/Features/NowPlaying/LocalDownloadManifest.m -o "$RUNNER_TEMP/local-download-test"
          "$RUNNER_TEMP/local-download-test"

      - name: Test automatic download model
        run: |
          clang -fobjc-arc -framework Foundation -DSG_AUTOMATIC_DOWNLOAD_TEST=1 \
            tweak/Sources/Features/NowPlaying/AutomaticDownloadModel.m \
            tweak/Sources/Features/NowPlaying/LocalDownloadManifest.m -o "$RUNNER_TEMP/automatic-download-test"
          "$RUNNER_TEMP/automatic-download-test"

      - name: Test manual audio import
        # The native import test uses synthetic audio, not a third-party recording.
        if: success()
        run: |
          clang -fobjc-arc -fblocks -framework Foundation -framework AVFoundation -framework CoreMedia -DSG_AUTOMATIC_AUDIO_TEST=1 \
            tweak/Sources/Features/NowPlaying/AutomaticAudioFile.m \
            tweak/Sources/Features/NowPlaying/AutomaticDownloadModel.m \
            tweak/Sources/Features/NowPlaying/LocalDownloadManifest.m -o "$RUNNER_TEMP/manual-audio-test"
          "$RUNNER_TEMP/manual-audio-test"

      - name: Test native collection metadata
        run: |
          clang -fobjc-arc -framework Foundation -DSG_NATIVE_COLLECTION_TEST=1 \
            tweak/Sources/Features/NowPlaying/NativeDownloadCollection.m \
            tweak/Sources/Features/NowPlaying/AutomaticDownloadModel.m \
            tweak/Sources/Features/NowPlaying/LocalDownloadManifest.m -o "$RUNNER_TEMP/native-collection-test"
          "$RUNNER_TEMP/native-collection-test"

      - name: Test native audio resolver
        run: bash scripts/test-native-audio.sh

      - name: Download IPA
        run: |
          mkdir -p ipa
          curl -fsSL "$SPOTIFY_IPA_URL" -o ipa/spotify.ipa
          case "$(file --mime-type -b ipa/spotify.ipa)" in
            application/zip|application/x-ios-app) ;;
            *) echo "::error::Not an IPA"; exit 1 ;;
          esac

      - name: Build IPA
        env:
          CYAN_PYTHON: python3
        # Explicit bash also works if a phone upload loses pipeline.sh's executable bit.
        run: bash scripts/pipeline.sh ipa/spotify.ipa --no-flex

      - uses: actions/upload-artifact@v5
        if: github.event_name == 'push' || inputs.upload_method != 'filebin'
        with:
          name: spoti.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: github.event_name == 'workflow_dispatch' && inputs.upload_method != 'artifacts'
        run: |
          BIN="spotifyglass-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
